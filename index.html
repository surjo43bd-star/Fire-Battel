
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIRE BATTEL</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d19;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:22px;background:#111b30}
h1{color:#ff9b24;letter-spacing:4px;margin:0}
main{max-width:850px;margin:auto;padding:20px}
h2{color:#ffb33b}
.characters{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:#17243a;border:2px solid #293b57;border-radius:15px;padding:16px}
.card.selected{border-color:#ff9b24}
.avatar{font-size:65px;background:#263b57;border-radius:12px;padding:18px}
button{background:#ff9b24;color:#111;border:0;padding:12px 20px;border-radius:8px;font-weight:bold;cursor:pointer;margin:8px}
#message{color:#70e6a1;min-height:24px}
.back{background:#33445f;color:white}
</style>
</head>
<body>
<header>
<h1>🔥 FIRE BATTEL</h1>
<p>CHARACTER SELECTION</p>
</header>
<main>
<h2>Choose Your Fighter</h2>
<p>Select your favourite character.</p>
<div class="characters" id="characters"></div>
<h2 id="selectedName">Selected: RAHIM</h2>
<p id="message"></p>
<button onclick="confirmCharacter()">SELECT CHARACTER</button>
<button class="back" onclick="location.reload()">REFRESH</button>
</main>
<script>
const fighters=[
{name:"RAHIM",emoji:"🧑‍🚀",power:"Survival Expert"},
{name:"NOVA",emoji:"🥷",power:"Speed Master"},
{name:"BLAZE",emoji:"🦸",power:"Power Specialist"},
{name:"SHADOW",emoji:"👨‍🚒",power:"Stealth Expert"}
];
let selected=localStorage.getItem("fireCharacter")||"RAHIM";
function showCharacters(){
document.getElementById("characters").innerHTML=fighters.map(f=>`
<div class="card ${selected===f.name?'selected':''}">
<div class="avatar">${f.emoji}</div>
<h3>${f.name}</h3>
<p>${f.power}</p>
<button onclick="choose('${f.name}')">CHOOSE</button>
</div>`).join("");
document.getElementById("selectedName").textContent="Selected: "+selected;
}
function choose(name){
selected=name;
showCharacters();
document.getElementById("message").textContent="";
}
function confirmCharacter(){
localStorage.setItem("fireCharacter",selected);
document.getElementById("message").textContent="Character "+selected+" selected successfully!";
}
showCharacters();
</script>
</body>
</html>
